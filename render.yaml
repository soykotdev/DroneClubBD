# Render Blueprint for the API only. The client is a static Vite build —
# deploy that on Vercel (or any static host) separately, pointed at this
# service's URL via VITE_API_BASE_URL.
#
# Usage: in the Render dashboard, "New +" -> "Blueprint", pick this repo.
# Render reads this file and creates the service below; secrets marked
# `sync: false` are left blank for you to fill in manually in the dashboard
# (never committed here).
services:
  - type: web
    name: droneclub-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build:shared && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically — do not set it manually.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: droneclub
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIRECTORY
        value: uploads
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
